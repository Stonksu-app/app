name: Build iOS IPA (unsigned)

# Builds an unsigned .ipa for sideloading. AltStore re-signs it with your own
# Apple ID at install time, so no certificates or provisioning profiles are
# needed here — nothing secret ever touches this workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite bakes VITE_* variables into the bundle at build time, and .env is
      # gitignored, so without these the .ipa ships with the backend switched
      # off: no sync, no account, no registration prompt. The anon key is
      # designed to be public and ends up in the bundle either way; it lives in
      # secrets purely to keep it out of the repository.
      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Sin claves de Supabase — este .ipa guardará el progreso solo en el dispositivo."
          fi
          npm run build

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into an .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No se encontró $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p payload-root/Payload
          cp -R "$APP_PATH" payload-root/Payload/
          (cd payload-root && zip -qry ../Stonksu.ipa Payload)
          ls -lh Stonksu.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Stonksu-ipa
          path: Stonksu.ipa
          retention-days: 30
