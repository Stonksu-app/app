name: Build iOS IPA (unsigned)

# Builds an unsigned .ipa for sideloading. AltStore re-signs it with your own
# Apple ID at install time, so no certificates or provisioning profiles are
# needed here — nothing secret ever touches this workflow.
# Which Supabase project the build points at is decided by the tag:
#
#   v0.8.0-dev  ->  dev          v0.8.0  ->  production
#
# Repository variables and secrets are per-repo, not per-branch, so the two
# environments are told apart by a _DEV / _PROD suffix on the name. Anything
# ending in -dev, -beta or -rc counts as dev, so a release candidate can never
# be the thing that accidentally points a shipped app at the dev database.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Qué proyecto de Supabase usar
        type: choice
        options: [dev, production]
        default: dev
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Decide target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              *-dev|*-beta|*-rc|*-rc.*) NAME=dev ;;
              *) NAME=production ;;
            esac
          fi
          SUFFIX=$([ "$NAME" = "dev" ] && echo DEV || echo PROD)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Compilando para: $NAME (usando *_$SUFFIX)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite bakes VITE_* variables into the bundle at build time, and .env is
      # gitignored, so without these the .ipa ships with the backend switched
      # off: no sync, no account, no registration prompt. The anon key is
      # designed to be public and ends up in the bundle either way; it lives in
      # secrets purely to keep it out of the repository.
      - name: Build web assets
        env:
          TARGET: ${{ steps.target.outputs.name }}
          VITE_APP_ENV: ${{ steps.target.outputs.name }}
          # The unsuffixed names are a fallback for dev only. Production must be
          # named explicitly: a shipped app silently talking to the dev database
          # is worth failing a build over.
          VITE_SUPABASE_URL: >-
            ${{ vars[format('VITE_SUPABASE_URL_{0}', steps.target.outputs.suffix)]
                || (steps.target.outputs.name == 'dev' && vars.VITE_SUPABASE_URL) }}
          VITE_SUPABASE_ANON_KEY: >-
            ${{ secrets[format('VITE_SUPABASE_ANON_KEY_{0}', steps.target.outputs.suffix)]
                || (steps.target.outputs.name == 'dev' && secrets.VITE_SUPABASE_ANON_KEY) }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            if [ "$TARGET" = "production" ]; then
              echo "::error::Faltan VITE_SUPABASE_URL_PROD y/o VITE_SUPABASE_ANON_KEY_PROD."
              echo "Sin ellas este .ipa de producción saldría sin backend, o peor, apuntando a dev."
              exit 1
            fi
            echo "::warning::Sin claves de Supabase — este .ipa guardará el progreso solo en el dispositivo."
          fi
          npm run build

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into an .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No se encontró $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p payload-root/Payload
          cp -R "$APP_PATH" payload-root/Payload/
          (cd payload-root && zip -qry ../Stonksu.ipa Payload)
          ls -lh Stonksu.ipa

      # Named per environment so two downloaded .ipa files can't be mixed up.
      - uses: actions/upload-artifact@v4
        with:
          name: Stonksu-${{ steps.target.outputs.name }}-${{ github.ref_name }}
          path: Stonksu.ipa
          retention-days: 30
